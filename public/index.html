<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsNow MCP Server</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            text-align: center;
        }
        h1 { color: #0070f3; }
        code {
            background: #f4f4f4;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
        }
        .status {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.5rem 1rem;
            background: #e7f5ff;
            color: #0070f3;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>NewsNow MCP Server</h1>
    <p>This is a Model Context Protocol (MCP) server for NewsNow.</p>
    <p>SSE Endpoint: <code>/sse</code></p>
    <p>Messages Endpoint: <code>/messages</code></p>
    <div class="status">Server is running</div>
</body>
</html>
